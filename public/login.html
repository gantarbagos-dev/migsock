</head><body>
<div class="card">
  <div class="brand"><img src="/static/logo.webp?v=3" alt="MIGSOCK"><h1>MIG<span>SOCK</span></h1><small>DUEL V2 • SECURE ACCESS</small></div>
  <div id="error" class="error"></div>
  <form id="loginForm">
    <label>Username</label><input id="username" autocomplete="username" autocapitalize="none" required>
    <label>Password</label><input id="password" type="password" autocomplete="current-password" required>
    <label class="remember-option"><input id="rememberSession" type="checkbox"> Simpan sesi login</label>
    <button id="submit" type="submit">LOGIN</button>
  </form>
  <button id="checkUpdate" type="button" style="margin-top:12px;background:linear-gradient(120deg,#0f9f76,#16b8a6)!important">CHECK UPDATE</button>
  <div id="updateMessage" class="hint" role="status" aria-live="polite" style="margin-top:10px;display:none"></div>
</div>
<script>
const form=document.getElementById('loginForm'),err=document.getElementById('error'),btn=document.getElementById('submit');
const updateBtn=document.getElementById('checkUpdate'),updateMessage=document.getElementById('updateMessage');
updateBtn.addEventListener('click',async()=>{updateBtn.disabled=true;updateBtn.textContent='CHECKING...';updateMessage.style.display='block';updateMessage.textContent='Memeriksa update...';try{const installedSha256=new URLSearchParams(location.search).get('installedSha256')||'';const checkUrl='/api/update/check'+(installedSha256?'?installedSha256='+encodeURIComponent(installedSha256):'');const r=await fetch(checkUrl,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal memeriksa update');if(!d.available||d.up_to_date){updateMessage.textContent='Your software already uptodate';return;}updateMessage.textContent='Update ditemukan: '+d.filename+' — membuka unduhan...';const downloadUrl=d.url||'/api/update/download';window.location.assign(downloadUrl);}catch(e){updateMessage.textContent=e.message||'Gagal memeriksa update';}finally{updateBtn.disabled=false;updateBtn.textContent='CHECK UPDATE';}});
// Jika cookie sesi masih sah, langsung buka aplikasi tanpa meminta username/password lagi.
(async()=>{try{const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});if(r.ok){const d=await r.json();if(d.ok&&d.authenticated){location.replace(d.user?.role==='admin'?'/admin':'/app');return}}}catch(_){} })();
function randomToken(bytes=32){const a=new Uint8Array(bytes);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
function deviceIdentity(usernameValue){
  const account=String(usernameValue||'').trim().toLowerCase();
  const idKey='migsock_device_id:'+account,secretKey='migsock_device_secret:'+account;
  let id=localStorage.getItem(idKey),secret=localStorage.getItem(secretKey);
  if(!id||!secret){id='dev_'+randomToken(16);secret=randomToken(32);localStorage.setItem(idKey,id);localStorage.setItem(secretKey,secret)}
  return {deviceId:id,deviceSecret:secret,deviceLabel:((navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||'Browser')+' device'};
}
form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='MEMERIKSA...';try{const identity=deviceIdentity(document.getElementById('username').value);const rememberSession=document.getElementById('rememberSession').checked;const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value,rememberSession,...identity})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Login gagal');location.href=d.user?.role==='admin'?'/admin':'/app'}catch(e){err.textContent=e.message;err.style.display='block';btn.disabled=false;btn.textContent='LOGIN'}});
</script>
